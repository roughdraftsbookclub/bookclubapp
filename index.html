<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   ROUGH DRAFTS BOOK CLUB — clickable prototype
   No backend. All state lives in the STORE object below and is shared by
   every simulated device on this page, which is how the realtime sync is
   demonstrated: change a phase as admin, switch to a phone, it has moved.
   ========================================================================== */
:root{
  --navy:#0E1A2B; --navy-2:#1C3049; --gold:#C2902E; --gold-2:#DCAE5C;
  --cream:#F6F2EC; --card:#FFF; --ink:#1A1A1A; --ink-2:#5A6070; --ink-3:#8A8F9C;
  --hair:#E4E1DA; --danger:#B3452F; --green:#2E6B4F;
  --r-sm:8px; --r-md:12px; --r-lg:16px;
  --shadow:0 1px 2px rgba(14,26,43,.06),0 4px 14px rgba(14,26,43,.05);
  --serif:"Source Serif 4",Georgia,serif;
  --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--sans); color:var(--ink); background:#15161A;
  -webkit-font-smoothing:antialiased;
  min-height:100vh; display:flex; flex-direction:column; align-items:center;
  padding:18px 12px 40px;
}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
input,textarea{font:inherit;color:inherit}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ============================ SIMULATOR CHROME ============================ */
.sim{ width:100%; max-width:430px; margin-bottom:14px; color:#E8E9EC; }
.previewnote{ font-size:12.5px; line-height:1.6; color:#A9AEBA; margin:0 0 12px; }
.previewnote strong{ color:#fff; display:block; margin-bottom:3px; font-weight:600; }
.sim h2{
  font-family:var(--serif); font-size:15px; font-weight:600; margin:0 0 3px;
  letter-spacing:.2px; color:#fff;
}
.sim .hint{ font-size:11.5px; color:#8A8F9C; line-height:1.5; margin:0 0 11px; }
.devices{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:9px; }
.dev{
  font-size:11.5px; font-weight:600; padding:7px 11px; border-radius:999px;
  background:#24262E; color:#A9AEBA; display:flex; align-items:center; gap:6px;
  transition:background .15s ease,color .15s ease;
}
.dev[aria-pressed="true"]{ background:#E8E9EC; color:#15161A; }
.dev .dot{ width:6px;height:6px;border-radius:50%;background:#4A4E59; }
.dev.voted .dot{ background:#4CAF7D; }
.dev[aria-pressed="true"] .dot{ background:#9AA0AC; }
.dev[aria-pressed="true"].voted .dot{ background:#2E6B4F; }
.simrow{ display:flex; gap:6px; flex-wrap:wrap; }
.simbtn{
  font-size:11px; font-weight:600; padding:6px 10px; border-radius:6px;
  background:#24262E; color:#A9AEBA; border:1px solid #33363F;
}
.simbtn:hover{ background:#2E313A; color:#E8E9EC; }
.simbtn.warn{ color:#E0917F; border-color:#4A3230; }

/* ================================ PHONE =================================== */
.phone{
  width:390px; height:844px; background:var(--cream);
  border-radius:44px; border:11px solid #0E0E10;
  box-shadow:0 30px 70px rgba(0,0,0,.55);
  overflow:hidden; position:relative; display:flex; flex-direction:column;
  flex:0 0 auto;
}
.viewport{ flex:1 1 auto; display:flex; flex-direction:column; overflow:hidden; position:relative; }

/* practice banner */
.practicebar{
  flex:0 0 auto; background:repeating-linear-gradient(135deg,#C2902E,#C2902E 10px,#A87B22 10px,#A87B22 20px);
  color:#1F1704; font-size:10.5px; font-weight:700; letter-spacing:1.3px;
  text-align:center; padding:5px; text-transform:uppercase;
}

/* ================================ LAYOUT ================================== */
.appbar{ flex:0 0 auto; position:relative; padding:12px 20px 10px; text-align:center; }
.appbar h1{
  font-family:var(--serif); font-size:21px; font-weight:600; margin:0;
  letter-spacing:-.2px; color:var(--navy); line-height:1.25;
}
.appbar .sub{ margin-top:5px; font-size:12.5px; color:var(--ink-3); }
.appbar .nav-btn{
  position:absolute; top:8px; left:10px; width:36px; height:36px;
  border-radius:50%; display:grid; place-items:center; color:var(--navy);
}
.appbar .nav-btn:active{background:rgba(14,26,43,.07)}
.body{ flex:1 1 auto; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:2px 16px 8px; }
.body.pad-lg{ padding:2px 22px 8px; }
.actionbar{
  flex:0 0 auto; padding:11px 18px 26px;
  background:linear-gradient(180deg,rgba(244,242,237,0),var(--cream) 30%);
}
.homebar{
  position:absolute; left:50%; bottom:8px; transform:translateX(-50%);
  width:134px; height:5px; border-radius:3px; background:rgba(0,0,0,.72);
  pointer-events:none; z-index:6;
}

/* ================================ BUTTONS ================================= */
.btn{
  display:flex; align-items:center; justify-content:center; gap:8px;
  width:100%; height:52px; border-radius:var(--r-md);
  font-size:15px; font-weight:600; letter-spacing:.1px;
  transition:transform .12s ease,background .15s ease,opacity .15s ease;
}
.btn:active{transform:scale(.985)}
.btn-primary{background:var(--navy);color:#fff}
.btn-primary:disabled{background:#B9BEC9;color:#F2F3F5;cursor:not-allowed;transform:none}
.btn-gold{background:var(--gold);color:#1F1704}
.btn-danger{background:transparent;color:var(--danger);border:1.5px solid rgba(179,69,47,.4)}
.btn-outline{background:transparent;color:var(--navy);border:1.5px solid rgba(14,26,43,.25)}
.btn-ghost{background:transparent;color:var(--navy);height:44px}
.btn-sm{height:40px;font-size:13.5px;border-radius:var(--r-sm)}

/* ================================ COVERS ================================== */
.cover{
  flex:0 0 auto; position:relative; overflow:hidden; border-radius:3px;
  width:46px; height:69px; padding:5px 4px; color:#fff;
  display:flex; flex-direction:column; justify-content:space-between;
  box-shadow:0 1px 3px rgba(0,0,0,.22),inset -3px 0 6px rgba(0,0,0,.12);
}
.cover::after{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
  background:linear-gradient(90deg,rgba(0,0,0,.3),transparent)}
.cover .glyph{position:absolute;inset:0;display:grid;place-items:center;font-size:22px;opacity:.45}
.cover .ct{font-family:var(--serif);font-size:6.5px;font-weight:700;line-height:1.15;
  letter-spacing:.2px;text-transform:uppercase;text-shadow:0 1px 1px rgba(0,0,0,.3);position:relative}
.cover .ca{font-size:5px;opacity:.85;letter-spacing:.3px;text-transform:uppercase;position:relative}
.cover.md{width:70px;height:105px;padding:7px 6px}
.cover.md .ct{font-size:9px} .cover.md .ca{font-size:6.5px} .cover.md .glyph{font-size:32px}
.cover.lg{width:118px;height:177px;padding:10px 9px;border-radius:4px}
.cover.lg .ct{font-size:14px} .cover.lg .ca{font-size:9.5px} .cover.lg .glyph{font-size:54px}
.cover.xl{width:150px;height:225px;padding:12px 11px;border-radius:5px;
  box-shadow:0 8px 30px rgba(0,0,0,.35),inset -4px 0 10px rgba(0,0,0,.14)}
.cover.xl .ct{font-size:17px} .cover.xl .ca{font-size:11px} .cover.xl .glyph{font-size:66px}

/* =========================== APPROVAL GRID (PHASE 1) ====================== */
.pickbar{
  position:sticky; top:0; z-index:4; margin:0 -16px 10px; padding:9px 16px 10px;
  background:var(--cream); border-bottom:1px solid var(--hair);
  display:flex; align-items:center; justify-content:space-between;
}
.pickbar .n{ font-size:13px; font-weight:700; color:var(--navy); }
.pickbar .n span{ color:var(--ink-3); font-weight:500; }
.pips{ display:flex; gap:5px; }
.pip{ width:9px;height:9px;border-radius:50%;background:rgba(14,26,43,.14);
  transition:background .2s ease,transform .2s ease }
.pip.on{ background:var(--gold); transform:scale(1.15) }

.grid{ display:grid; grid-template-columns:1fr 1fr; gap:11px; padding-bottom:8px; }
.pickcard{
  position:relative; background:var(--card); border-radius:var(--r-md);
  padding:11px 10px 12px; text-align:center; box-shadow:var(--shadow);
  display:flex; flex-direction:column; align-items:center; gap:9px;
  border:2px solid transparent; transition:border-color .15s ease,transform .12s ease,box-shadow .15s ease;
  animation:pop .3s cubic-bezier(.32,.72,0,1) both;
}
@keyframes pop{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
.pickcard:active{transform:scale(.97)}
.pickcard[aria-pressed="true"]{ border-color:var(--gold); box-shadow:0 0 0 3px rgba(194,144,46,.16),var(--shadow); }
.pickcard.maxed{ opacity:.42; }
.pickcard .pt{ font-size:12.5px; font-weight:700; line-height:1.25; color:var(--ink); }
.pickcard .pa{ font-size:11px; color:var(--ink-3); margin-top:2px; }
.tickmark{
  position:absolute; top:8px; right:8px; width:24px; height:24px; border-radius:50%;
  background:var(--gold); color:var(--navy); display:grid; place-items:center;
  transform:scale(0); transition:transform .22s cubic-bezier(.34,1.56,.64,1);
  box-shadow:0 2px 6px rgba(0,0,0,.2);
}
.pickcard[aria-pressed="true"] .tickmark{transform:scale(1)}

/* =========================== RANK (PHASE 2) ============================== */
.ranksec{ margin-bottom:6px; }
.seclabel{
  font-size:10.5px; font-weight:700; letter-spacing:1.1px; text-transform:uppercase;
  color:var(--ink-3); margin:14px 2px 8px;
}
.rankslot{
  display:flex; align-items:center; gap:11px; background:var(--card);
  border-radius:var(--r-md); padding:10px 12px 10px 10px; margin-bottom:9px;
  box-shadow:var(--shadow); border:2px solid var(--gold);
  touch-action:none; user-select:none;
  transition:transform .18s cubic-bezier(.32,.72,0,1),box-shadow .15s ease,opacity .15s ease;
}
.rankslot.dragging{

(() => {

/* ==========================================================================

  shortlistFloor:  3,

  // No organizer code here any more — it's checked inside the database now

  // A 17-book shelf with a 5-8 book shortlist means most books "miss" most

const SUPABASE_URL = 'https://xshhhizeotzfcgfioezq.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_-PCcYrW19CpQV9HBVrnctA_eCocpxtD';

/* The club's actual shelf, imported from the public page.

  ['The Left Hand of Darkness','Ursula K. Le Guin','0441478123','isbn/0441478123'],
  ['The Lords of Discipline','Pat Conroy','0553381563','isbn/0553381563'],
  ['The Heaven & Earth Grocery Store','James McBride','0593422945','isbn/0593422945'],
  ['In the Heart of the Sea','Nathaniel Philbrick','0141001828','isbn/0141001828'],

  ['The Hitchhiker\'s Guide to the Galaxy','Douglas Adams','0345391802','isbn/0345391802'],

  ['The Godfather','Mario Puzo','0451205766','isbn/0451205766'],
  ['Lonesome Dove','Larry McMurtry','0671795899','id/8375908'],
  ['Dune','Frank Herbert','0441172717','isbn/0441172717'],
  ['Wind, Sand and Stars','Antoine de Saint-Exupéry','0156027496','isbn/0156027496'],
  ['East of Eden','John Steinbeck','0142004235','isbn/0142004235'],
  ['Meditations','Marcus Aurelius','0812968255','isbn/0812968255'],
  ['Man\'s Search for Meaning','Viktor E. Frankl','0807014273','isbn/0807014273'],
];

const CURRENT_BOOK = ['Barbarian Days','William Finnegan','0143109391','isbn/0143109391'];
const PREVIOUSLY_READ = [
  ['City of Thieves','David Benioff','0452295297','isbn/0452295297','July 2026'],
];

const uid = p => p + Math.random().toString(36).slice(2,9);

const olCover = (path, size='M') => `https://covers.openlibrary.org/b/${path}-${size}.jpg`;
const amazonURL = isbn => `https://www.amazon.com/dp/${isbn}`;
const amazonSearch = (title, author) =>
  'https://www.amazon.com/s?k=' + encodeURIComponent([title, author].filter(Boolean).join(' '));

/* A 978-prefixed ISBN-13 and an ISBN-10 share the same 9 identifying digits —
   only the check digit differs, and it's computed differently (mod 11, not
   mod 10). 979-prefixed ISBN-13s have no ISBN-10 equivalent at all; there's
   nothing to convert. Verified against three real published ISBN-10/13 pairs. */
function isbn13to10(isbn13){
  if (!isbn13 || !/^978\d{9}[\dXx]$/.test(isbn13)) return null;
  const core = isbn13.slice(3, 12);
  let sum = 0;
  for (let i = 0; i < 9; i++) sum += (10 - i) * Number(core[i]);
  const check = (11 - (sum % 11)) % 11;
  return core + (check === 10 ? 'X' : String(check));
}

/* Amazon's /dp/ only resolves an ISBN-10 (it IS the ASIN for print books —
   Kindle editions carry their own, unrelated ASINs). Try direct, then a
   converted ISBN-13, then fall back to a real search URL — never a bare
   title string, which isn't a working link at all. */
function buildAmazonLink(isbn10, isbn13, title, author){
  if (isbn10) return amazonURL(isbn10);
  const converted = isbn13to10(isbn13);
  if (converted) return amazonURL(converted);
  return amazonSearch(title, author);
}

/* Required by Open Library's API etiquette — a generic UA gets rate-limited
   more aggressively. No personal contact info in client-side source that
   ships to every visitor. */
const OL_HEADERS = { 'User-Agent': 'RoughDraftsBookClub/1.0 (+https://github.com/roughdraftsbookclub/bookclubapp)' };

/* A drawn cover is only ever a fallback for a book with no jacket. */
const FALLBACK = [['#1E3A5F','#0A1626'],['#8C3B2E','#3E1610'],['#2E5B44','#173226'],
                  ['#4A3C72','#221B3A'],['#245E6B','#0C2C33'],['#96591F','#4A2A0C']];

function mkBook(row, i, status){
  const [title, author, isbn, cover] = row;
  const [c1,c2] = FALLBACK[i % FALLBACK.length];
  return {
    id:'bk'+(i+1), title, author, isbn,
    coverURL: cover ? olCover(cover) : null,
    coverLarge: cover ? olCover(cover,'L') : null,
    amazon: isbn ? amazonURL(isbn) : null,
    c1, c2, glyph:'📖',
    status,                                  // active | current | read | archived
    addedAt:'2026-0'+(6+(i%2))+'-'+String(2+(i%26)).padStart(2,'0'),
    byToken: null,                           // imported, not suggested in-app
    meetingsConsidered: 1 + (i % 3),
    zeroVoteStreak: 0,
    shortlistMisses: i % 4,
    everShortlisted: i % 5 === 0,
    needsReview: false,
    archiveReason: null, archivedAt: null,
  };
}

function seedBooks(){
  const books = SEED.map((row,i) => mkBook(row, i, 'active'));
  books.push(mkBook(CURRENT_BOOK, SEED.length, 'current'));
  PREVIOUSLY_READ.forEach((row,j) => {
    const b = mkBook(row, SEED.length + 1 + j, 'read');
    b.dateRead = row[4];
    books.push(b);
  });
  return books;
}
const CURRENT_ID = 'bk' + (SEED.length + 1);

/* Meetings land on the second Thursday unless the organiser overrides it. */
function secondThursday(y, m){
  const first = new Date(y, m, 1);
  const shift = (4 - first.getDay() + 7) % 7;      // 4 = Thursday
  return new Date(y, m, 1 + shift + 7);
}
function nextClubMeeting(from = new Date()){
  // Compare by date, not exact timestamp — otherwise the second Thursday
  // looks "already past" from any time after midnight on the day itself,
  // including all evening, which is when the meeting is actually happening.
  const today = new Date(from.getFullYear(), from.getMonth(), from.getDate());
  let d = secondThursday(from.getFullYear(), from.getMonth());
  if (d < today) d = secondThursday(from.getFullYear(), from.getMonth() + 1);
  return d;
}
const ymd = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;

/* ==========================================================================
   SUGGESTION WINDOW — derived from the schedule, not a weekly cadence and
   not the second-Thursday rule. Opens 9pm the night of a meeting, closes
   11:59pm the Sunday before the *next* one — so a skipped month (December)
   just falls out of the data: the window opened after November stays open
   straight through the holidays and closes ahead of January, no special
   case needed. Replaces the old "locks the moment Phase One opens" rule.
   ========================================================================== */
const CLUB_TIMEZONE = 'America/New_York';   // pinned once, never the device clock

/** The UTC instant whose wall-clock reading in `tz` is y-m-d hh:mm. */
function zonedDate(y, m, d, hh, mm, tz){
  const guess = Date.UTC(y, m, d, hh, mm);
  const parts = new Intl.DateTimeFormat('en-US', {
    timeZone: tz, hourCycle: 'h23',
    year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit',
  }).formatToParts(new Date(guess)).reduce((o,p) => (p.type !== 'literal' && (o[p.type] = +p.value), o), {});
  const readAsUTC = Date.UTC(parts.year, parts.month - 1, parts.day, parts.hour, parts.minute, parts.second || 0);
  return new Date(guess - (readAsUTC - guess));
}

/** The Sunday immediately before the given date (UTC calendar date, no time-of-day). */
function sundayBefore(y, m, d){
  const dt = new Date(Date.UTC(y, m, d));
  const back = dt.getUTCDay() === 0 ? 7 : dt.getUTCDay();
  dt.setUTCDate(dt.getUTCDate() - back);
  return [dt.getUTCFullYear(), dt.getUTCMonth(), dt.getUTCDate()];
}

/**
 * Whether suggestions are open right now, from the schedule table alone.
 * scheduleRows: [{sortIndex, meetingDate: 'YYYY-MM-DD' | null}, ...]
 */
function suggestionWindowState(scheduleRows, now = new Date()){
  const dated = scheduleRows.filter(r => r.meetingDate).slice().sort((a,b) => a.sortIndex - b.sortIndex);
  if (!dated.length) return { open: true, opensAt: null, closesAt: null };   // no schedule yet — never block on missing data

  const periods = dated.map((row, i) => {
    const [y,m,d] = row.meetingDate.split('-').map(Number);
    const opensAt = zonedDate(y, m - 1, d, 21, 0, CLUB_TIMEZONE);
    const next = dated[i + 1];
    let closesAt = null;
    if (next){
      const [ny,nm,nd] = next.meetingDate.split('-').map(Number);
      const [sy,sm,sd] = sundayBefore(ny, nm - 1, nd);
      closesAt = zonedDate(sy, sm, sd, 23, 59, CLUB_TIMEZONE);
    }
    return { opensAt, closesAt };
  });

  for (const p of periods)
    if (now >= p.opensAt && (p.closesAt === null || now < p.closesAt)) return { open: true, ...p };

  const upcoming = periods.find(p => p.opensAt > now);
  return { open: false, opensAt: upcoming ? upcoming.opensAt : null, closesAt: null };
}
const prettyDate = s => new Date(s + 'T00:00:00')
  .toLocaleDateString(undefined, { weekday:'long', month:'long', day:'numeric' });

/* books, club and meeting all start empty and get filled in by bootstrap()
   from Supabase — see the bottom of this file. Nothing here is seed data any
   more; supabase/seed.sql owns the real shelf now. */
const STORE = {
  books: [],
  currentBookId: null,
  club: { autoDate: true, date: '', time: '', host: '', location: '', locationNote: '' },
  schedule: [],
  meeting: null,
  adminOpen: false,            // organizer console pulled up
  organizerUnlocked: false,    // passcode entered this session
  organizerCode: null,         // held in memory only, needed on every organizer RPC call
  adminTab: 'meeting',
  resultsRound: 0,
};

/** The one identity for this browser — no more per-device switching. */
const activeDevice = () => ({ token: MY_TOKEN, isOrganizer: IS_ORGANIZER_LINK });

/* ==========================================================================
   2. RANKED-CHOICE (INSTANT RUNOFF)
   Handles truncated ballots: once a voter's ranked books are all eliminated
   their ballot is exhausted and drops out of the active total, which is why
   the majority threshold is recomputed each round.
   ========================================================================== */
function runIRV(ballots, candidateIds){
  const remaining = new Set(candidateIds);
  const rounds = [];
  let guard = 0;

  /* Break a tie by countback: look at the most recent round where the tied
     books differed. For a tie at the bottom (who gets eliminated) that means
     whoever was weakest there; for a tie at the top (who actually won) it's
     the mirror image — whoever was strongest earlier gets it, since that's
     the book with more sustained support, not less. Either way it's
     deterministic as a last resort, so the same ballots always produce the
     same result. */
  const countback = (ids, pickWeakest = true) => {
    for (let r = rounds.length - 1; r >= 0; r--){
      const t = rounds[r].tally;
      const val = pickWeakest ? Math.min(...ids.map(id => t[id] ?? 0))
                               : Math.max(...ids.map(id => t[id] ?? 0));
      const still = ids.filter(id => (t[id] ?? 0) === val);
      if (still.length === 1) return still[0];
      ids = still;
    }
    return [...ids].sort()[0];
  };

  while (guard++ < 40){
    const tally = {};
    remaining.forEach(id => tally[id] = 0);

    let active = 0;
    ballots.forEach(b => {
      const pick = b.find(id => remaining.has(id));   // first surviving preference
      if (pick){ tally[pick]++; active++; }           // otherwise the ballot is exhausted
    });

    const desc = Object.entries(tally).sort((a,b) => b[1]-a[1]);
    const round = {
      tally:{...tally}, active, exhausted: ballots.length - active,
      threshold: Math.floor(active/2) + 1, eliminated:[], tiebreak:false,
    };
    rounds.push(round);
    if (!desc.length) return { rounds, winner:null, tied:[] };

    const top = desc[0][1];
    const leaders = desc.filter(([,v]) => v === top).map(([k]) => k);

    // Majority of still-active ballots, or last one standing. A genuine tie
    // among the leaders is resolved by countback rather than an arbitrary
    // pick — same guarantee the rest of IRV already has (same ballots, same
    // winner, every time) — and means the results screen can say plainly it
    // was a tie instead of presenting a coin flip as a clean win.
    if (top >= round.threshold || remaining.size <= 1){
      const winner = leaders.length > 1 ? countback(leaders, false) : desc[0][0];
      return { rounds, winner, tied: leaders.length > 1 ? leaders : [] };
    }

    const min = desc[desc.length-1][1];
    const atMin = desc.filter(([,v]) => v === min).map(([k]) => k);

    if (atMin.length === remaining.size){      // dead level — nothing to eliminate
      const winner = leaders.length > 1 ? countback(leaders, false) : desc[0][0];
      return { rounds, winner, tied: leaders };
    }

    let out;
    if (atMin.length === 1){
      out = atMin;
    } else {
      const nextUp = desc.filter(([,v]) => v > min).pop();   // lowest above the floor
      // Bulk exclusion only when the whole tied group couldn't overtake anyone
      // even if merged. Otherwise drop exactly one, or we risk denying a
      // survivor transfers that would have changed the result.
      if (nextUp && min * atMin.length < nextUp[1]) out = atMin;
      else { out = [countback(atMin)]; round.tiebreak = true; }
    }
    round.eliminated = out;
    out.forEach(id => remaining.delete(id));
  }
  return { rounds, winner:null, tied:[] };
}

/* ==========================================================================
   3. MEETING ENGINE
   ========================================================================== */
const M = () => STORE.meeting;
const book = id => STORE.books.find(b => b.id === id);
const approvalCount = () => Object.keys(M().approvalBallots).length;
const rankCount     = () => Object.keys(M().rankBallots).length;

function approvalTally(){
  const t = {};
  M().candidateIds.forEach(id => t[id] = 0);
  Object.values(M().approvalBallots).forEach(ids => ids.forEach(id => { if (id in t) t[id]++; }));
  return t;
}

/**
 * Build the shortlist by cutting where the votes actually break, anywhere in
 * the 5–8 window, preferring the break nearest 6.
 *
 * Nine voters produce approval counts in a range of about 0–9, so a fixed
 * six-book cutoff lands mid-cluster roughly half the time and kicks the
 * decision to the admin — which would make manual curation the normal path
 * and quietly undo the point of voting. Floating the size fixes it without
 * asking members to do anything differently.
 */
function computeShortlist(){
  const t = approvalTally();
  const sorted = Object.entries(t).sort((a,b) =>
    (b[1]-a[1]) || book(a[0]).title.localeCompare(book(b[0]).title));

  const { shortlistMin:min, shortlistMax:max, shortlistTarget:target } = CONFIG;
  if (sorted.length <= min) return { list: sorted.map(([k]) => k), tie:null };

  const cuts = [];
  for (let k = min; k <= Math.min(max, sorted.length-1); k++)
    if (sorted[k-1][1] > sorted[k][1]) cuts.push(k);      // a genuine gap in the votes

  if (cuts.length){
    cuts.sort((a,b) => Math.abs(a-target) - Math.abs(b-target) || a-b);
    return { list: sorted.slice(0, cuts[0]).map(([k]) => k), tie:null };
  }

  /* No clean break in the window. Rather than ask the organizer to choose —
     which in simulation meant adjudicating between books on 0 or 1 votes 96%
     of the time — cut the list short and take only books with clear support.
     Padding the shortlist with books nobody asked for is worse than a short
     shortlist. */
  const size = Math.min(target, sorted.length);
  const cutoffVotes = sorted[size-1][1];
  const above = sorted.filter(([,v]) => v > cutoffVotes).map(([k]) => k);

  if (above.length >= CONFIG.shortlistFloor)
    return { list: above, tie:null, cutShort:{ droppedAt: cutoffVotes,
             dropped: sorted.filter(([,v]) => v === cutoffVotes).length } };

  /* Too few cleared the bar to make a real ranked round. Fall back to the
     highest-scoring books by vote, then by longest time on the shelf — still
     deterministic, still nothing for the organizer to decide. */
  const filled = sorted.slice(0, Math.max(CONFIG.shortlistFloor, size))
    .sort((a,b) => (b[1]-a[1]) || (new Date(book(a[0]).addedAt) - new Date(book(b[0]).addedAt)))
    .map(([k]) => k);
  return { list: filled, tie:null, cutShort:{ droppedAt: cutoffVotes, dropped: 0, thin:true } };
}

/* Phase transitions are computed locally with the same tested functions as
   always (computeShortlist / runIRV / buildArchiveQueue), then persisted
   through advance_phase() so every phone sees the move at once and a random
   request can't skip a phase without the organizer passcode. */
async function closeApproval(){
  const { list, cutShort } = computeShortlist();
  const { error } = await supa.rpc('advance_phase', {
    p_code: STORE.organizerCode, p_meeting_id: M().id, p_new_phase: 'shortlist_review',
    p_shortlist_ids: list, p_cut_short: cutShort || null,
  });
  if (error){ toast('Could not close Phase One — try again'); return; }
  M().tie = null;                    // the organizer never breaks a tie
  M().shortlistIds = list;
  M().cutShort = cutShort || null;
  M().phase = 'shortlist_review';
  render();
}

async function startRanked(){
  const { error } = await supa.rpc('advance_phase', {
    p_code: STORE.organizerCode, p_meeting_id: M().id, p_new_phase: 'ranked',
  });
  if (error){ toast('Could not open Phase Two — try again'); return; }
  M().phase = 'ranked';
  M().rankBallots = {};
  render();
}

async function closeRanked(){
  const ballots = Object.values(M().rankBallots);
  const irv = runIRV(ballots, M().shortlistIds);
  const result = {
    irv, winnerId: irv.winner, approval: approvalTally(),
    voters: approvalCount(), rankVoters: ballots.length,
  };
  const archiveQueue = buildArchiveQueue();
  const { error } = await supa.rpc('advance_phase', {
    p_code: STORE.organizerCode, p_meeting_id: M().id, p_new_phase: 'results',
    p_result: result, p_archive_queue: archiveQueue,
  });
  if (error){ toast('Could not close voting — try again'); return; }
  M().result = result;
  M().archiveQueue = archiveQueue;
  M().phase = 'results';
  STORE.resultsRound = 0;
  render();
}

/** Books that have gone cold — the rule is config, not hard-coded. */
function buildArchiveQueue(){
  const t = approvalTally();
  const madeShortlist = new Set(M().shortlistIds || []);
  return M().candidateIds.map(id => {
    const b = book(id);
    const zeros  = (t[id] === 0) ? b.zeroVoteStreak + 1 : 0;
    const misses = madeShortlist.has(id) ? 0 : b.shortlistMisses + 1;
    let reason = null;
    if (zeros  >= CONFIG.zeroVoteStreakToArchive)
      reason = `No interest at ${zeros} meetings running`;
    else if (misses >= CONFIG.shortlistMissesToArchive)
      reason = `Missed the shortlist ${misses} meetings running`;
    return reason ? { id, reason, zeros, misses } : null;
  }).filter(Boolean);
}

/** Applying results is the only step that mutates the permanent book records —
    one database transaction (publish_results, in supabase/schema.sql) rather
    than several round trips a half-loaded phone could leave half-applied. */
async function publishResults(){
  const w = book(M().result.winnerId);
  const { error } = await supa.rpc('publish_results', {
    p_code: STORE.organizerCode,
    p_meeting_id: M().id,
    p_winner_id: M().result.winnerId,
    p_approval_tally: approvalTally(),
    p_archive_queue: M().archiveQueue || [],
  });
  if (error){ toast('Could not publish — try again'); return; }
  toast(`${w ? w.title : 'Winner'} is now the club's book`);
  await Promise.all([refreshBooks(), refreshCurrentMeeting()]);
  render();
}

const $  = (s,r=document) => r.querySelector(s);

const esc = s => String(s).replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const vp = () => $('#viewport');

function coverHTML(b, size=''){
  // A real jacket from the lookup wins; otherwise fall back to the drawn cover.
  if (b.coverURL)
    return `<div class="cover ${size} art" style="background:${b.c1}">
      <img src="${esc(b.coverURL)}" alt="" loading="lazy"></div>`;
  return `<div class="cover ${size}" style="background:linear-gradient(150deg,${b.c1},${b.c2})">
    <span class="glyph">${b.glyph}</span>
    <span class="ct">${esc(b.title)}</span>
    <span class="ca">${esc(b.author || '')}</span>
  </div>`;
}

/* ==========================================================================
   BOOK LOOKUP
   Google Books first (better jackets and metadata), Open Library as a
   fallback. Both are free and keyless. Everything is wrapped so that a dead
   network degrades to "add just the title" rather than blocking a suggestion.
   ========================================================================== */
/**
 * Book lookup, via Open Library.
 *
 * Google Books was the original choice, but their keyless daily quota is now
 * zero — every unauthenticated request comes back 429 RESOURCE_EXHAUSTED. Open
 * Library needs no key, supports CORS, and returns jackets, ISBNs and page
 * counts, which is everything the confirmation screen shows.
 */
async function lookupBook(title, author){
  const q = (author ? `${title} ${author}` : title).trim();
  const url = 'https://openlibrary.org/search.json?q=' + encodeURIComponent(q)
            + '&limit=12&fields=key,title,author_name,first_publish_year,cover_i,isbn,number_of_pages_median';

  let data;
  try {
    const ac = new AbortController();
    const timer = setTimeout(() => ac.abort(), 9000);
    const r = await fetch(url, { signal: ac.signal, headers: OL_HEADERS }).finally(() => clearTimeout(timer));
    if (!r.ok) return null;                 // 4xx/5xx — say so, don't claim "no match"
    data = await r.json();
    if (data.error) return null;
  } catch (e){
    return null;                            // offline, blocked, or opened from file://
  }

  const seen = new Set();
  const hits = (data.docs || [])
    // A result with no jacket is useless on a confirmation screen, and dropping
    // them also clears out most of the study guides and summaries.
    .filter(d => d.title && d.cover_i)
    .map(d => {
      const isbns = d.isbn || [];
      // Amazon /dp/ takes an ISBN-10; a 13 won't resolve. This is only a
      // fallback now — the real pick happens per-edition once a specific
      // book is chosen (fetchEditionCandidates), since this array is every
      // ISBN across every edition of the work, not any one coherent edition.
      const isbn10 = isbns.find(x => x.length === 10 && /^[0-9Xx]+$/.test(x)) || '';
      return {
        workKey: d.key || null,             // '/works/OL...W' — feeds the edition/description fetch
        title:  d.title,
        author: (d.author_name || []).join(', '),
        year:   d.first_publish_year ? String(d.first_publish_year) : '',
        pages:  d.number_of_pages_median || null,
        isbn:   isbn10,
        cover:  olCover(`id/${d.cover_i}`),
        // Fall back to a search when there's no ISBN-10 to link directly.
        buy:    isbn10 ? amazonURL(isbn10) : amazonSearch(d.title, (d.author_name||[])[0]),
      };
    })
    .filter(h => {
      const k = (h.title + '|' + h.author).toLowerCase();
      return seen.has(k) ? false : (seen.add(k), true);
    });

  return hits.slice(0,5);                   // [] means searched, nothing matched
}

/**
 * A work's editions span every language, translation, study guide and
 * graded reader ever catalogued — unsorted, and often missing a cover or
 * ISBN entirely. This is the actual fix for "bad Amazon links": the old
 * code picked an arbitrary ISBN out of the search result's aggregated
 * (every-edition) array. This fetches the real per-edition data and keeps
 * only plausible candidates: a cover, an ISBN, a page count that isn't an
 * abridged-reader artifact (a 1-page "edition" is real data Open Library
 * returns, not a hypothetical) — and English, checked two ways, because the
 * `languages` field is often just missing rather than absent-because-English:
 * a real Italian "East of Eden" edition in the wild carries no `languages`
 * tag at all, so language alone would have let it through. Requiring every
 * significant word of the original title to also appear in the edition's
 * title catches what the language check misses.
 */
async function fetchEditionCandidates(workKey, workTitle){
  if (!workKey) return [];
  const titleTokens = (workTitle || '').toLowerCase().replace(/[^a-z0-9]+/g, ' ')
    .split(' ').filter(w => w.length > 2);
  const titleLikelyMatches = editionTitle => {
    if (!titleTokens.length) return true;
    const have = new Set((editionTitle || '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').split(' '));
    return titleTokens.every(t => have.has(t));
  };
  try {
    const ac = new AbortController();
    const timer = setTimeout(() => ac.abort(), 9000);
    const r = await fetch(`https://openlibrary.org${workKey}/editions.json?limit=50`,
      { signal: ac.signal, headers: OL_HEADERS }).finally(() => clearTimeout(timer));
    if (!r.ok) return [];
    const data = await r.json();
    const seen = new Set();
    return (data.entries || [])
      .map(e => {
        const isbn10 = (e.isbn_10 || [])[0] || null;
        const isbn13 = (e.isbn_13 || [])[0] || null;
        const coverId = (e.covers || []).find(c => c > 0) || null;
        const isEnglish = !e.languages || e.languages.some(l => l.key === '/languages/eng');
        return {
          publisher: (e.publishers || [])[0] || '',
          year: (e.publish_date || '').match(/\d{4}/)?.[0] || '',
          pages: e.number_of_pages || null,
          isbn10, isbn13,
          cover: coverId ? olCover(`id/${coverId}`) : '',
          plausible: isEnglish && titleLikelyMatches(e.title) && !!coverId
                     && (isbn10 || isbn13) && (!e.number_of_pages || e.number_of_pages >= 40),
        };
      })
      .filter(e => e.plausible)
      .filter(e => {                          // de-dupe same publisher+year+pages
        const k = `${e.publisher}|${e.year}|${e.pages}`;
        return seen.has(k) ? false : (seen.add(k), true);
      })
      .sort((a,b) => (b.year||'0') - (a.year||'0'))   // prefer the more recent, more common print
      .slice(0, 4);
  } catch (e){
    return [];                                // never blocks the flow — falls back to work-level data
  }
}

/** Description lives on the work, not any edition, and comes back as either
    a plain string or {type, value} — verified live, both shapes occur. */
async function fetchWorkDescription(workKey){
  if (!workKey) return null;
  try {
    const ac = new AbortController();
    const timer = setTimeout(() => ac.abort(), 9000);
    const r = await fetch(`https://openlibrary.org${workKey}.json`,
      { signal: ac.signal, headers: OL_HEADERS }).finally(() => clearTimeout(timer));
    if (!r.ok) return null;
    const data = await r.json();
    const d = data.description;
    if (!d) return null;
    return typeof d === 'string' ? d : (d.value || null);
  } catch (e){
    return null;
  }
}

/* Deterministic decorative QR stand-in — a real build would encode the join URL. */
function qrSVG(seed, size=132){
  const n = 21, cell = size/n;
  let h = 0; for (const ch of seed) h = (h*31 + ch.charCodeAt(0)) >>> 0;
  const rnd = () => (h = (h*1103515245 + 12345) >>> 0) / 4294967296;
  let cells = '';
  for (let y=0; y<n; y++) for (let x=0; x<n; x++){
    const finder = (x<7&&y<7)||(x>n-8&&y<7)||(x<7&&y>n-8);
    if (finder) continue;
    if (rnd() > .55)
      cells += `<rect x="${(x*cell).toFixed(2)}" y="${(y*cell).toFixed(2)}" width="${cell.toFixed(2)}" height="${cell.toFixed(2)}"/>`;
  }
  const eye = (ex,ey) => `
    <rect x="${ex*cell}" y="${ey*cell}" width="${7*cell}" height="${7*cell}"/>
    <rect x="${(ex+1)*cell}" y="${(ey+1)*cell}" width="${5*cell}" height="${5*cell}" fill="#fff"/>
    <rect x="${(ex+2)*cell}" y="${(ey+2)*cell}" width="${3*cell}" height="${3*cell}"/>`;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" fill="#0E1A2B">
    ${cells}${eye(0,0)}${eye(n-7,0)}${eye(0,n-7)}
  </svg>`;
}

   6. MEMBER SCREENS
   ========================================================================== */
let localPick = [];   // this browser's unsubmitted Phase One picks
let localRank = [];   // this browser's unsubmitted Phase Two ranking

function renderMember(){
  const d = M(), me = activeDevice();
  const token = me.token;

  // A new meeting drops everyone back to their home screen.
  const n = nav();
  if (n._mt !== d.id) Object.assign(n, { screen:'home', bookId:null, _mt:d.id });

  if (d.phase === 'lobby')            return memberLobby();
  if (d.phase === 'approval')         return d.approvalBallots[token] ? memberWaiting('approval') : memberApproval(token);
  if (d.phase === 'shortlist_review') return memberWaiting('counting');
  if (d.phase === 'ranked')           return d.rankBallots[token]     ? memberWaiting('ranked')   : memberRank(token);
  if (d.phase === 'results')          return memberResults();
}

/* ---------------- Member landing: home / shelf / detail / nominate ---------
   Nominating is open between meetings and in the lobby, and locks the moment
   Phase One opens — the candidate list must not move under a ballot already
   in progress. */

const goto = (screen, bookId=null) => {

  render();
};

function memberLobby(){

  return memberHome();

function memberHome(){

  const c = STORE.club;
  const days = Math.round((new Date(c.date + 'T00:00:00') - new Date().setHours(0,0,0,0)) / 864e5);

  vp().innerHTML = `${practiceBar()}${orgBar()}
    <div class="brandhdr">${logoImg(238)}</div>
    <div class="body" style="padding-top:12px">

      <div class="meetcard">
        <div class="k">Next meeting</div>
        <div class="d">${prettyDate(c.date)}</div>
        <div class="w">
          <span>${esc(c.time)}</span>${c.host ? `<i></i><span>Hosted by ${esc(c.host)}</span>` : ''}

      ${cur ? `<div class="nowcard">
        ${coverHTML(cur,'md')}
        <span class="meta">
          <div class="k">This month's book</div>
          <div class="t">${esc(cur.title)}</div>
          <div class="a">${esc(cur.author)}</div>

      <button class="tile" id="t-books">
        <span class="ic"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z"/></svg></span>

/** Fetches the real per-edition data for one picked work, then routes to the
    edition picker (2+ good candidates) or straight to confirm (0 or 1). */
async function resolveEdition(hit, rawTitle, rawAuthor, hits){
  memberCheckingEdition();
  const [editions, description] = await Promise.all([
    fetchEditionCandidates(hit.workKey, hit.title),
    fetchWorkDescription(hit.workKey),
  ]);
  if (editions.length >= 2) return memberPickEdition(hit, editions, description, rawTitle, rawAuthor, hits);
  return memberConfirmBook(mergeEditionIntoHit(hit, editions[0] || null, description), rawTitle, rawAuthor, hits);
}

/** Combines the work-level pick with a chosen (or absent) specific edition.
    Title/author/year always come from the work — an edition can be a
    translation with a different title, which is never what belongs on the
    shelf. Falls back to the work-level cover/isbn/pages when no edition was
    pinned, same data the app already showed before this existed. */
function mergeEditionIntoHit(hit, edition, description){
  const isbn10 = edition?.isbn10 || hit.isbn || '';
  const isbn13 = edition?.isbn13 || '';
  const cover  = edition?.cover || hit.cover || '';
  const pages  = edition?.pages || hit.pages || null;
  return {
    title: hit.title, author: hit.author, year: hit.year,
    isbn: isbn10, isbn13, cover, pages, description,
    buy: buildAmazonLink(isbn10, isbn13, hit.title, hit.author),
  };
}

/** Step three: write it to the shelf. */
async function commitSuggestion({ title, author, cover, isbn, isbn13, buy, description, pages, year }){
  const me = activeDevice();

  const dupe = STORE.books.find(b => b.title.toLowerCase() === title.toLowerCase());
  if (dupe){
    goto('books');
    toast(dupe.status === 'archived'
      ? `${dupe.title} was archived — ask the organizer to revive it`
      : `${dupe.title} is already on the list`);
    return;
  }

  const [c1,c2] = FALLBACK[Math.floor(Math.random()*FALLBACK.length)];
  const row = {
    id: uid('bk'), title, author, isbn: isbn || null, isbn13: isbn13 || null,
    cover_url: cover || null,
    cover_large: cover ? cover.replace(/-M\.jpg$/, '-L.jpg') : null,
    amazon: buy || (isbn ? amazonURL(isbn) : null),
    c1, c2, glyph: '📖',
    status: 'active', added_at: new Date().toISOString().slice(0,10),
    by_token: me.token,
    // A confirmed lookup carries its own cover and author, so it needs no
    // cleanup. A raw title does.
    needs_review: !cover,
    description: description || null,
    page_count: pages || null,
    first_publish_year: year ? Number(year) : null,
  };

  const { error } = await supa.from('books').insert(row);
  if (error){
    toast("Couldn't add that — check your connection and try again");
    return;
  }
  STORE.books.push(bookFromRow(row));

  // A book added before voting opens joins tonight's ballot. No passcode —
  // suggesting was never organizer-gated (add_candidate_if_lobby, schema.sql).
  // Awaited and checked — this used to be fire-and-forget, which meant a
  // failed call (e.g. the browser backgrounded right after tapping Add)
  // silently left a real suggestion off the ballot with no one the wiser.
  if (M().phase === 'lobby'){
    const { error: joinError } = await supa.rpc('add_candidate_if_lobby', { p_book_id: row.id });
    if (joinError){
      toast(`${title} was added to the shelf, but couldn't join tonight's ballot — tell the organizer`);
      goto('books');
      return;
    }
    M().candidateIds = [...M().candidateIds, row.id];
  }

  goto('books');
  toast(`${title} is on the table`);
}

/** Pointer-based reordering — works with touch and mouse, unlike HTML5 drag. */
function wireDrag(container, arr, redraw){
  if (!container) return;
  $$('[data-drag]', container).forEach(handle => {
    handle.addEventListener('pointerdown', e => {
      e.preventDefault();
      const row = handle.closest('.rankslot');
      const rows = $$('.rankslot', container);
      const from = rows.indexOf(row);
      const h = row.offsetHeight + 9;
      const startY = e.clientY;
      let delta = 0;
      row.classList.add('dragging');
      handle.setPointerCapture(e.pointerId);   // capture on the listener element

      const move = ev => {
        const dy = ev.clientY - startY;
        row.style.transform = `translateY(${dy}px) scale(1.03)`;
        const target = Math.max(0, Math.min(rows.length-1, from + Math.round(dy/h)));
        if (target !== from + delta){
          delta = target - from;
          rows.forEach((r,i) => {
            if (r === row) return;
            let shift = 0;
            if (i > from && i <= target) shift = -h;
            if (i < from && i >= target) shift =  h;
            r.style.transform = `translateY(${shift}px)`;
          });
        }
      };
      const up = () => {
        handle.releasePointerCapture(e.pointerId);
        handle.removeEventListener('pointermove', move);
        handle.removeEventListener('pointerup', up);
        const to = from + delta;
        if (to !== from) arr.splice(to, 0, arr.splice(from,1)[0]);
        redraw();
      };
      handle.addEventListener('pointermove', move);
      handle.addEventListener('pointerup', up);
    });
  });
}

      <button class="btn btn-primary" id="submit-rank">Submit My Ranking</button>
      <button class="btn btn-ghost" id="rank-edit">Edit My Ranking</button>
    </div>`;
  $('#rank-back').onclick = $('#rank-edit').onclick = () => memberRank(token);
  $('#submit-rank').onclick = async () => {
    const ids = [...ranked];
    M().rankBallots[token] = ids;
    localRank = [];
    render();
    const { error } = await supa.from('ballots').upsert(
      { meeting_id: M().id, token, phase: 'ranked', book_ids: ids, updated_at: new Date().toISOString() },
      { onConflict: 'meeting_id,token,phase' }
    );
    if (error){
      delete M().rankBallots[token];
      localRank = ids;
      toast('Ranking failed to save — try again');
      render();
    }
  };
}

function memberResults(){
  const r = M().result, w = book(r.winnerId);
  const t = r.approval, voters = r.voters || 1;
  const ordered = Object.entries(t).sort((a,b) => b[1]-a[1]);
  const rounds = r.irv.rounds;
  const ri = Math.min(STORE.resultsRound, rounds.length-1);
  const round = rounds[ri];
  const rmax = Math.max(1, ...Object.values(round.tally));

  vp().innerHTML = `${practiceBar()}${orgBar()}
    <div class="confetti">${Array.from({length:26},(_,i) => {
      const c = ['#C2902E','#0E1A2B','#D7B45A','#3E6B54'][i%4];
      return `<i style="left:${(i*3.9+2)%97}%;background:${c};animation-delay:${(i%9)*90}ms"></i>`;
    }).join('')}</div>
    <div class="body">
      <div class="winnerwrap">
        <div class="kicker">The club will read</div>
        ${w ? coverHTML(w,'xl') : ''}
        <h2>${w ? esc(w.title) : 'No winner'}</h2>
        <div class="wa">${w ? esc(w.author) : ''}</div>
        <div class="wmeta">Won in ${plural(rounds.length,'round','rounds')} · ${plural(r.rankVoters,'ballot','ballots')} cast</div>
        ${(r.irv.tied||[]).length > 1 ? `<div class="wmeta">Exact tie for first place — broken by countback
          (whoever had more support in the most recent round where the tied books differed). Same ballots,
          same result, every time — nobody had to pick.</div>` : ''}
      </div>

      <div class="resultcard">
        <h3>Interest round</h3>
        ${ordered.map(([id,v]) => {
          const pct = Math.round(v/voters*100);
          const onShort = (M().shortlistIds||[]).includes(id);
          return `<div class="barrow">
            <div class="bl"><span class="bn">${esc(book(id).title)}</span><span class="bv">${pct}%</span></div>
            <div class="bartrack"><div class="barfill ${onShort?'gold':''}" data-w="${pct}"></div></div>
          </div>`;
        }).join('')}
        <div class="roundnote">Gold bars made the shortlist. ${voters} members voted.</div>
      </div>

      <div class="resultcard">
        <h3>Ranked runoff</h3>
        <div class="roundtabs">
          ${rounds.map((_,i) => `<button data-round="${i}" aria-pressed="${i===ri}">Round ${i+1}</button>`).join('')}
        </div>
        ${Object.entries(round.tally).sort((a,b) => b[1]-a[1]).map(([id,v]) => `
          <div class="barrow ${round.eliminated.includes(id)?'out':''}">
            <div class="bl"><span class="bn">${esc(book(id).title)}</span><span class="bv">${v}</span></div>
            <div class="bartrack"><div class="barfill ${id===r.winnerId?'gold':''}" data-w="${Math.round(v/rmax*100)}"></div></div>
          </div>`).join('')}
        <div class="roundnote">
          Needed ${round.threshold} of ${round.active} active ballots.
          ${round.exhausted ? `${plural(round.exhausted,'ballot','ballots')} exhausted. ` : ''}
          ${round.eliminated.length ? `Eliminated: ${round.eliminated.map(id => esc(book(id).title)).join(', ')}.` : 'Majority reached.'}
          ${round.tiebreak ? ' Tie for last broken by earlier-round counts.' : ''}
        </div>
      </div>

      ${(M().archiveQueue||[]).length ? `<div class="resultcard">
        <h3>Headed to the archive</h3>
        ${M().archiveQueue.map(({id,reason}) => `
          <div class="archrow">${coverHTML(book(id))}
            <span class="meta"><span class="at">${esc(book(id).title)}</span><div class="ar">${esc(reason)}</div></span>
          </div>`).join('')}
        <div class="roundnote">They stay in the database and can be suggested again any time.</div>
      </div>` : ''}

      <div class="stepnote">Phones away. See you next month.</div>
      <div style="height:14px"></div>
    </div>`;

  requestAnimationFrame(() => $$('.barfill').forEach(el => el.style.width = el.dataset.w + '%'));
  $$('[data-round]').forEach(el => el.onclick = () => { STORE.resultsRound = +el.dataset.round; memberResults(); });
}

    const t = approvalTally();
    {
      ctrl = `
        <div class="panel">
          <h3>Shortlist — ${plural(m.shortlistIds.length,'book','books')}</h3>
          ${m.shortlistIds.map(id => `
            <div class="adminbook">${coverHTML(book(id))}
              <span class="meta"><span class="at">${esc(book(id).title)}</span><div class="aa">${esc(book(id).author)}</div></span>
              <span class="tag">${plural(t[id],'vote','votes')}</span>
            </div>`).join('')}
          <div class="subnote" style="margin-top:9px">
            ${m.cutShort && m.cutShort.dropped
              ? `Cut at ${plural(m.cutShort.dropped,'book','books')} tied on
                 ${plural(m.cutShort.droppedAt,'vote','votes')} — they don't advance rather
                 than you picking between them.`
              : `Cut where the votes broke rather than forcing exactly ${CONFIG.shortlistTarget}.`}

          <div style="height:13px"></div>
          <button class="btn btn-primary" id="a-start2">Open Phase Two — ranking</button>

      <div class="panel">
        <h3>Phase Two — ranking</h3>
        <div class="phasepill"><span class="dot"></span>Ranking open</div>
        <div style="height:14px"></div>
        <div class="bigcount">${voted}<small> of ${m.expectedVoters} ranked</small></div>
        <div class="progtrack"><div class="progfill" style="width:${pct}%"></div></div>

        <button class="btn btn-primary" id="a-publish">${m.isPractice ? 'End Practice Run' : 'Publish Results'}</button>
      </div>`;
  }

  const c = STORE.club;
  const attWarn = voted > m.expectedVoters
    ? `<div class="subnote" style="margin-top:8px;color:#7A5A16">
         ${voted} ballots cast — more than the ${m.expectedVoters} you set. Worth a quick check.</div>` : '';
  el.innerHTML = ctrl + `
    <div class="panel">
      <h3>Members present tonight</h3>

        <button class="stepbtn" id="att-minus" ${m.expectedVoters <= 1 ? 'disabled' : ''}>−</button>

      <label class="flabel" for="c-host">Host</label>
      <input class="control" id="c-host" type="text" value="${esc(c.host)}" placeholder="Who's hosting?">
      <div style="height:11px"></div>
      <label class="flabel" for="c-loc">Location <span style="font-weight:500;color:var(--ink-3)">optional</span></label>
      <input class="control" id="c-loc" type="text" value="${esc(c.location)}" placeholder="Address or venue">
      <div style="height:11px"></div>
      <label class="flabel" for="c-note">Directions <span style="font-weight:500;color:var(--ink-3)">optional</span></label>
      <input class="control" id="c-note" type="text" value="${esc(c.locationNote)}" placeholder="Park on the street">
      <div style="height:13px"></div>
      <button class="btn btn-primary btn-sm" id="c-save">Update meeting details</button>
    </div>`;

  const on = (sel,fn) => { const e = $(sel); if (e) e.onclick = fn; };
  on('#a-start', async () => {
    const { error } = await supa.rpc('advance_phase', {
      p_code: STORE.organizerCode, p_meeting_id: m.id, p_new_phase: 'approval',
    });
    if (error){ toast('Could not open voting — try again'); return; }
    m.phase = 'approval'; render();
  });
  on('#a-close1', closeApproval);
  on('#a-start2', startRanked);
  on('#a-close2', closeRanked);
  on('#a-publish', publishResults);
  const setAttendance = async n => {
    const prev = m.expectedVoters;
    m.expectedVoters = n; renderAdmin();      // optimistic — corrected below on failure
    const { error } = await supa.rpc('set_expected_voters', {
      p_code: STORE.organizerCode, p_meeting_id: m.id, p_count: n,
    });
    if (error){ m.expectedVoters = prev; toast('Could not update — try again'); renderAdmin(); }
  };

    toast('Link copied — paste it into the group text');
  });
  on('#c-auto', () => {
    c.autoDate = !c.autoDate;
    if (c.autoDate) c.date = ymd(nextClubMeeting());
    renderAdmin();
  });
  on('#c-save', async () => {
    if (!c.autoDate) c.date = $('#c-date').value || c.date;
    c.time = $('#c-time').value.trim() || c.time;
    c.host = $('#c-host').value.trim();
    c.location = $('#c-loc').value.trim();
    c.locationNote = $('#c-note').value.trim();
    const { error } = await supa.rpc('update_club_settings', {
      p_code: STORE.organizerCode, p_auto_date: c.autoDate, p_date: c.date,
      p_time: c.time, p_host: c.host, p_location: c.location, p_location_note: c.locationNote,
    });
    if (error){ toast('Could not save — try again'); return; }
    toast('Members will see the new details');
    renderAdmin();
  });

  $$('[data-keep]').forEach(e => e.onclick = () => {
    m.archiveQueue = m.archiveQueue.filter(a => a.id !== e.dataset.keep);
    toast('Kept on the active list'); renderAdmin();
  });

}

  });
  $$('[data-toggle]').forEach(e => e.onclick = async () => {
    const b = book(e.dataset.toggle);
    const wasArchived = b.status === 'archived';
    const { error } = await supa.rpc('toggle_book_archived', { p_code: STORE.organizerCode, p_book_id: b.id });
    if (error){ toast('Could not update — try again'); return; }
    b.status = wasArchived ? 'active' : 'archived';
    b.archiveReason = wasArchived ? null : 'Archived by organizer';
    toast(`${b.title} → ${b.status}`);
    renderAdmin();
  });
  $$('[data-edit]').forEach(e => e.onclick = () => { editingBookId = e.dataset.edit; renderAdmin(); });
  $$('[data-cancel-edit]').forEach(e => e.onclick = () => { editingBookId = null; renderAdmin(); });
  $$('[data-save-edit]').forEach(e => e.onclick = async () => {
    const id = e.dataset.saveEdit;
    const existing = book(id);
    const title = $('#e-title').value.trim();
    if (!title){ toast('Title can\'t be empty'); return; }
    const author = $('#e-author').value.trim();
    const isbn = $('#e-isbn').value.trim();
    const coverURL = $('#e-cover').value.trim();
    const coverLarge = coverURL ? coverURL.replace(/-M\.jpg$/, '-L.jpg') : '';
    const amazon = $('#e-amazon').value.trim();
    // isbn13/description/pageCount/firstPublishYear aren't in this form yet —
    // carry the existing values through rather than wiping them to null.
    const { error } = await supa.rpc('update_book', {
      p_code: STORE.organizerCode, p_book_id: id, p_title: title, p_author: author || null,
      p_isbn: isbn || null, p_isbn13: existing.isbn13 || null,
      p_cover_url: coverURL || null, p_cover_large: coverLarge || null, p_amazon: amazon || null,
      p_description: existing.description || null, p_page_count: existing.pageCount || null,
      p_first_publish_year: existing.firstPublishYear || null,
    });
    if (error){ toast('Could not save — try again'); return; }
    const b = book(id);
    Object.assign(b, { title, author, isbn, coverURL, coverLarge, amazon, needsReview: false });
    editingBookId = null;
    toast('Saved'); renderAdmin();
  });
  $$('[data-delete]').forEach(e => e.onclick = async () => {
    const b = book(e.dataset.delete);
    if (!confirm(`Delete "${b.title}" permanently? This can't be undone.`)) return;
    const { error } = await supa.rpc('delete_book', { p_code: STORE.organizerCode, p_book_id: b.id });
    if (error){ toast('Could not delete — it may be linked to a scheduled meeting'); return; }
    STORE.books = STORE.books.filter(x => x.id !== b.id);
    toast(`${b.title} deleted`); renderAdmin();
  });
}

/* Stand-in for an Open Library lookup: token overlap against a small catalogue. */
const CATALOGUE = [
  ...SEED.map(([t,a]) => ({title:t, author:a})),
  {title:'Shackleton', author:'Ranulph Fiennes'},
  {title:'The Road', author:'Cormac McCarthy'},
  {title:'Killers of the Flower Moon', author:'David Grann'},
  {title:'Jonathan Strange & Mr Norrell', author:'Susanna Clarke'},
];
function fuzzyMatch(q){
  const toks = q.toLowerCase().split(/\s+/).filter(w => w.length > 2);
  let best = null, bestScore = 0;
  CATALOGUE.forEach(c => {
    const hay = (c.title + ' ' + c.author).toLowerCase();
    const score = toks.filter(t => hay.includes(t)).length / Math.max(1, toks.length);
    if (score > bestScore){ bestScore = score; best = c; }
  });
  return { query:q, match: bestScore >= .5 ? best : null, confidence: bestScore };
}

function renderMatches(){
  const el = $('#matches');
  if (!pendingMatches.length){ el.innerHTML = ''; return; }
  el.innerHTML = `<div class="panel">
    <h3>Confirm before adding</h3>
    ${pendingMatches.map((m,i) => m.match ? `
      <div class="matchrow">
        <span class="meta">
          <div class="mq">“${esc(m.query)}”</div>
          <div class="mt">${esc(m.match.title)}</div>
          <div class="ma">${esc(m.match.author)}</div>
        </span>
        <span class="conf ${m.confidence < .8 ? 'low':''}">${Math.round(m.confidence*100)}%</span>
        <button class="iconbtn" data-drop="${i}"><svg width="13" height="13" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M1.5 1.5l11 11M12.5 1.5l-11 11"/></svg></button>
      </div>` : `
      <div class="matchrow miss">
        <span class="meta"><div class="mq">“${esc(m.query)}”</div><div class="mt">No confident match</div>
        <div class="ma">Add by hand or try more words</div></span>
        <button class="iconbtn" data-drop="${i}"><svg width="13" height="13" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M1.5 1.5l11 11M12.5 1.5l-11 11"/></svg></button>
      </div>`).join('')}
    <div style="height:6px"></div>
    <button class="btn btn-primary btn-sm" id="m-confirm">Add ${pendingMatches.filter(m=>m.match).length} to the table</button>
  </div>`;

  $$('[data-drop]').forEach(e => e.onclick = () => {
    pendingMatches.splice(+e.dataset.drop,1); renderMatches();
  });
  $('#m-confirm').onclick = () => {
    const pal = [['#1E3A5F','#0A1626'],['#8C3B2E','#3E1610'],['#2E5B44','#173226'],['#4A3C72','#221B3A']];
    let n = 0;
    pendingMatches.filter(m => m.match).forEach(m => {
      if (STORE.books.some(b => b.title.toLowerCase() === m.match.title.toLowerCase())) return;
      const [c1,c2] = pal[Math.floor(Math.random()*pal.length)];
      STORE.books.push({
        id: uid('bk'), title:m.match.title, author:m.match.author, c1, c2, glyph:'📖',
        status:'active', addedAt:new Date().toISOString().slice(0,10), byToken:null,
        meetingsConsidered:0, zeroVoteStreak:0, shortlistMisses:0, everShortlisted:false,
        archiveReason:null, archivedAt:null,
      });
      n++;
    });
    if (M().phase === 'lobby') M().candidateIds = STORE.books.filter(b => b.status==='active').map(b => b.id);
    pendingMatches = [];
    toast(n ? `${plural(n,'book','books')} on the table` : 'Already on the list');
    renderAdmin();
  };
}

function adminHistory(el){
  const cur = STORE.currentBookId ? book(STORE.currentBookId) : null;
  const read = STORE.books.filter(b => b.status === 'read');
  const arch = STORE.books.filter(b => b.status === 'archived');
  el.innerHTML = `
    <div class="panel">
      <h3>Current book</h3>
      ${cur ? `<div class="adminbook">${coverHTML(cur,'md')}
        <span class="meta"><span class="at" style="font-size:15px">${esc(cur.title)}</span>
        <div class="aa">${esc(cur.author)}</div></span></div>`
      : `<div class="subnote">None yet — finish a meeting to set one.</div>`}
    </div>
    <div class="panel">
      <h3>Previously read — ${read.length}</h3>
      ${read.length ? read.map(b => `<div class="adminbook">${coverHTML(b)}
        <span class="meta"><span class="at">${esc(b.title)}</span><div class="aa">${esc(b.author)}</div></span></div>`).join('')
      : `<div class="subnote">Nothing yet.</div>`}
    </div>
    <div class="panel">
      <h3>Archived — ${arch.length}</h3>
      ${arch.length ? arch.map(b => `<div class="adminbook">${coverHTML(b)}
        <span class="meta"><span class="at">${esc(b.title)}</span><div class="ar aa">${esc(b.archiveReason||'')}</div></span>
        <button class="iconbtn" data-revive="${b.id}">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M7 12V2M2.5 6.5 7 2l4.5 4.5"/></svg>
        </button></div>`).join('')
      : `<div class="subnote">Nothing archived.</div>`}
      <div class="subnote" style="margin-top:10px">Archived books stay in the database. Anyone can put one back on the table.</div>
    </div>
    <div class="panel">
      <h3>Meeting record</h3>
      <div class="subnote">Each finished meeting writes a readable record — date, turnout, both rounds, winner, archives. Stored here first; pushing it to a Google Doc is a later add-on that nothing depends on.</div>
    </div>`;
  $$('[data-revive]').forEach(e => e.onclick = () => {
    const b = book(e.dataset.revive);
    b.status = 'active'; b.archiveReason = null; b.zeroVoteStreak = 0; b.shortlistMisses = 0;
    toast(`${b.title} is back on the table`); renderAdmin();
  });
}

/* ==========================================================================
   8. SHELL
   ========================================================================== */
/** Replaces the old four-phone switcher: one real identity per browser. */
function renderIdentity(){
  const el = $('#devices');
  if (!el) return;
  const me = activeDevice();
  const m = M();
  const voted = m && (m.phase === 'ranked'   ? !!m.rankBallots[me.token]
                     : m.phase === 'approval' ? !!m.approvalBallots[me.token] : false);
  el.innerHTML = `<span class="dev ${voted?'voted':''}" aria-pressed="true">
    <i class="dot"></i>You${me.isOrganizer ? '<em class="orgtag">organizer</em>' : ''}</span>`;
}

/** Thin strip only the organizer sees, sitting on top of the normal member app. */
function orgBar(){
  if (!activeDevice().isOrganizer) return '';
  return STORE.adminOpen
    ? `<div class="orgbar open">
         <span class="ol"><i></i>Organizer view</span>
         <button class="ob" id="org-back">Back to my ballot</button>
       </div>`
    : `<div class="orgbar">
         <span class="ol"><i></i>${PHASE_LABEL[M().phase]}</span>
         <button class="ob" id="org-open">Run meeting</button>
       </div>`;
}

/* The organizer console lives on a separate bookmarked URL behind a short
   code. Nobody stumbles into it from the link you text out. */
function organizerGate(){
  vp().innerHTML = `${practiceBar()}${orgBar()}
    <div class="waiting">
      <div class="seal">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
          <rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>
        </svg>
      </div>
      <h2>Organizer</h2>
      <p>Enter the code from your bookmark.</p>
      <input class="control code" id="g-code" type="text" inputmode="numeric"
             maxlength="4" placeholder="••••" autocomplete="off">
      <div class="stepnote" id="g-err" style="color:var(--danger);visibility:hidden">That's not it.</div>
    </div>
    <div class="actionbar">
      <button class="btn btn-primary" id="g-go" disabled>Unlock</button>
      <button class="btn btn-ghost" id="g-cancel">Back to my ballot</button>
    </div>`;

  const f = $('#g-code'), go = $('#g-go');
  f.focus();
  f.oninput = () => {
    f.value = f.value.replace(/\D/g,'');
    $('#g-err').style.visibility = 'hidden';
    go.disabled = f.value.length !== 4;
  };
  f.onkeydown = e => { if (e.key === 'Enter' && !go.disabled) go.click(); };
  go.onclick = async () => {
    const code = f.value;
    go.disabled = true;
    const { data, error } = await supa.rpc('check_organizer_code', { p_code: code });
    if (!error && data === true){
      STORE.organizerUnlocked = true;
      STORE.organizerCode = code;   // held in memory, sent with every organizer RPC below
      render();
    } else {
      $('#g-err').style.visibility = 'visible';
      f.value = ''; f.focus();
    }
  };
  $('#g-cancel').onclick = () => { STORE.adminOpen = false; render(); };
}

function render(){
  renderIdentity();
  vp().className = 'viewport';
  const org = activeDevice().isOrganizer;
  if (org && STORE.adminOpen && !STORE.organizerUnlocked) organizerGate();
  else if (org && STORE.adminOpen) renderAdmin();
  else renderMember();
  const o = $('#org-open');
  if (o) o.onclick = () => { STORE.adminOpen = true; render(); };
  const b = $('#org-back');
  if (b) b.onclick = () => { STORE.adminOpen = false; render(); };
}

/* ==========================================================================
   9. SUPABASE — data loading, realtime sync, row <-> app-shape mapping
   Field names here are the mirror image of mkBook()/newMeeting() above:
   snake_case columns in, camelCase STORE shape out.
   ========================================================================== */
let supa = null;

function bookFromRow(r){
  return {
    id: r.id, title: r.title, author: r.author, isbn: r.isbn, isbn13: r.isbn13,
    coverURL: r.cover_url, coverLarge: r.cover_large, amazon: r.amazon,
    c1: r.c1, c2: r.c2, glyph: r.glyph || '📖', status: r.status,
    addedAt: r.added_at, byToken: r.by_token, needsReview: !!r.needs_review,
    meetingsConsidered: r.meetings_considered ?? 0,
    zeroVoteStreak: r.zero_vote_streak ?? 0,
    shortlistMisses: r.shortlist_misses ?? 0,
    everShortlisted: !!r.ever_shortlisted,
    archiveReason: r.archive_reason ?? null,
    archivedAt: r.archived_at ?? null,
    dateRead: r.date_read ?? null,
    description: r.description ?? null,
    pageCount: r.page_count ?? null,
    firstPublishYear: r.first_publish_year ?? null,
  };
}

function meetingFromRow(r, ballotRows){
  const approvalBallots = {}, rankBallots = {};
  (ballotRows || []).forEach(b => {
    (b.phase === 'approval' ? approvalBallots : rankBallots)[b.token] = b.book_ids;
  });
  return {
    id: r.id, date: r.date, isPractice: r.is_practice, phase: r.phase,
    candidateIds: r.candidate_ids || [], approvalBallots, rankBallots,
    shortlistIds: r.shortlist_ids, cutShort: r.cut_short, tie: null,
    result: r.result, archiveQueue: r.archive_queue, expectedVoters: r.expected_voters,
  };
}

/** auto_date means "follow the second-Thursday rule" — recomputed fresh on
    every load rather than trusted from the stored column, so it never goes
    stale between meetings without needing anything to write it back. */
function clubFromRow(r){
  return {
    autoDate: !!r.auto_date,
    date: r.auto_date ? ymd(nextClubMeeting()) : (r.date || ''),
    time: r.time || '7:00 PM',
    host: r.host || '',
    location: r.location || '',
    locationNote: r.location_note || '',
  };
}

async function loadBallots(meetingId){
  const { data } = await supa.from('ballots').select('*').eq('meeting_id', meetingId);
  return data || [];
}

async function refreshBooks(){
  const { data } = await supa.from('books').select('*');
  STORE.books = (data || []).map(bookFromRow);
}

function scheduleRowFromRow(r){
  return {
    id: r.id, sortIndex: r.sort_index, meetingDate: r.meeting_date,
    skipReason: r.skip_reason, host: r.host, bookId: r.book_id, provenance: r.provenance,
  };
}

async function refreshSchedule(){
  const { data } = await supa.from('schedule').select('*').order('sort_index');
  STORE.schedule = (data || []).map(scheduleRowFromRow);
}

async function refreshCurrentMeeting(){
  const { data } = await supa.from('meetings').select('*').eq('is_current', true).limit(1);
  const row = (data || [])[0];
  if (!row) return;
  const ballotRows = await loadBallots(row.id);
  STORE.meeting = meetingFromRow(row, ballotRows);
}

/** Every phone subscribes to the same four tables — this is what replaces
    the old "Phone 1-4" simulator: real devices, kept in sync for real. */
function subscribeRealtime(){
  supa.channel('rd-books').on('postgres_changes',
    { event: '*', schema: 'public', table: 'books' }, payload => {
      const row = payload.eventType === 'DELETE' ? payload.old : payload.new;
      if (!row) return;
      const idx = STORE.books.findIndex(b => b.id === row.id);
      if (payload.eventType === 'DELETE'){ if (idx >= 0) STORE.books.splice(idx, 1); }
      else {
        const mapped = bookFromRow(payload.new);
        if (idx >= 0) STORE.books[idx] = mapped; else STORE.books.push(mapped);
      }
      render();
    }).subscribe();

  supa.channel('rd-club').on('postgres_changes',
    { event: '*', schema: 'public', table: 'club' }, payload => {
      const r = payload.new; if (!r) return;
      STORE.club = clubFromRow(r);
      STORE.currentBookId = r.current_book_id;
      render();
    }).subscribe();

  supa.channel('rd-meetings').on('postgres_changes',
    { event: '*', schema: 'public', table: 'meetings' }, async payload => {
      const r = payload.new;
      if (!r || !r.is_current) return;   // ignore the meeting we just closed out
      const ballotRows = await loadBallots(r.id);
      STORE.meeting = meetingFromRow(r, ballotRows);
      render();
    }).subscribe();

  supa.channel('rd-ballots').on('postgres_changes',
    { event: '*', schema: 'public', table: 'ballots' }, payload => {
      const r = payload.eventType === 'DELETE' ? payload.old : payload.new;
      if (!r || !M() || r.meeting_id !== M().id) return;
      const bucket = r.phase === 'approval' ? M().approvalBallots : M().rankBallots;
      if (payload.eventType === 'DELETE') delete bucket[r.token];
      else bucket[r.token] = r.book_ids;
      render();
    }).subscribe();

  supa.channel('rd-schedule').on('postgres_changes',
    { event: '*', schema: 'public', table: 'schedule' }, payload => {
      const row = payload.eventType === 'DELETE' ? payload.old : payload.new;
      if (!row) return;
      const idx = STORE.schedule.findIndex(s => s.id === row.id);
      if (payload.eventType === 'DELETE'){ if (idx >= 0) STORE.schedule.splice(idx, 1); }
      else {
        const mapped = scheduleRowFromRow(payload.new);
        if (idx >= 0) STORE.schedule[idx] = mapped; else STORE.schedule.push(mapped);
      }
      render();
    }).subscribe();
}

async function bootstrap(){
  vp().innerHTML = `<div class="waiting"><h2>Loading…</h2><p>Fetching the shelf.</p></div>`;
  try {
    const { createClient } = await import('https://esm.sh/@supabase/supabase-js@2');
    supa = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    await refreshBooks();
    await refreshSchedule();

    const { data: clubRows } = await supa.from('club').select('*').limit(1);
    const clubRow = (clubRows || [])[0];
    if (clubRow){
      STORE.club = clubFromRow(clubRow);
      STORE.currentBookId = clubRow.current_book_id;
    }

    await refreshCurrentMeeting();
    if (!STORE.meeting){
      vp().innerHTML = `<div class="waiting"><h2>No meeting yet</h2>
        <p>Run supabase/seed.sql once against this project to open the first one.</p></div>`;
      return;
    }

    subscribeRealtime();
    render();
  } catch (e){
    console.error(e);
    vp().innerHTML = `<div class="waiting"><h2>Couldn't connect</h2>
      <p>Check your connection and reload.</p></div>`;
  }
}

bootstrap();
})();
</script>
